[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-intelligence-and-continuity-system"
version = "0.0.1"
description = "Reconstructed CICS foundation"
requires-python = ">=3.11"
dependencies = [
  "blake3>=1.0,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
